name: dbt CI Pipeline

on:
  pull_request:
    branches:
      - main
    paths:
      - 'models/**'
      - 'macros/**'
      - 'tests/**'
      - 'dbt_project.yml'

jobs:
  run-ci:
    name: Lint & Build dbt Models
    runs-on: ubuntu-latest

    env:
      DBT_SNOWFLAKE_USER: ${{ secrets.DBT_SNOWFLAKE_USER }}
      DBT_SNOWFLAKE_PASSWORD: ${{ secrets.DBT_SNOWFLAKE_PASSWORD }}
      DBT_PROFILES_DIR: ./.github

    steps:
      # 1. Checkout the PR branch
      - name: Checkout PR Branch
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install dbt, SQLFluff, and adapters
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake sqlfluff sqlfluff-templater-dbt

      # -------------------------------------------------------------
      # STAGE 1: SQL LINTING (Fast Fail)
      # -------------------------------------------------------------
      - name: Run SQL Fluff Linting
        run: |
          sqlfluff lint models/

      # -------------------------------------------------------------
      # STAGE 2: DOWNLOAD STATE (For Slim CI)
      # -------------------------------------------------------------
      - name: Download Production Manifest
        uses: dawidd6/action-download-artifact@v3
        with:
          branch: main
          workflow: prod_deploy.yml
          name: prod-manifest
          path: ./state
        continue-on-error: true

      # -------------------------------------------------------------
      # STAGE 3: DBT BUILD (Slim CI)
      # -------------------------------------------------------------
      - name: Install dbt Packages
        run: dbt deps

      - name: Run dbt Build (Modified Models + Tests)
        run: |
          if [ -f "./state/manifest.json" ]; then
            echo "Production manifest found. Running Slim CI on modified models..."
            dbt build --select state:modified+ --state ./state
          else
            echo "No production manifest found. Running full build..."
            dbt build
          fi
