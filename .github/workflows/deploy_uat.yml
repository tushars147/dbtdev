name: Deploy dbt to UAT Environment

on:
  push:
    branches:
      - main

jobs:
  deploy_to_uat:
    name: Build & Test in UAT
    runs-on: ubuntu-latest

    env:
      DBT_SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      DBT_SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      DBT_SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      DBT_SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      DBT_SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      DBT_SNOWFLAKE_UAT_DATABASE: ${{ secrets.SNOWFLAKE_UAT_DATABASE }}

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dbt Snowflake adapter
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake

      - name: Install dbt Dependencies
        run: |
          dbt deps --profiles-dir . --profile your_dbt_project

      - name: Execute dbt Build in UAT Target
        run: |
          dbt build --profiles-dir . --profile your_dbt_project --target uat
